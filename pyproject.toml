[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meldfabric"
version = "0.1.0-beta.1"
description = "Configuration-driven runtime and control plane for Strands Agents"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MeldFabric Contributors" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncmy>=0.2,<1",
  "asyncpg>=0.29,<1",
  "cryptography>=45,<47",
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "PyMySQL>=1.1,<2",
  "PyJWT>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<2.1",
  "a2a-sdk>=0.3,<0.4",
  "fastapi>=0.115,<0.163",
  "uvicorn[standard]>=0.30,<1",
  "strands-agents[openai]>=1.64,<1.65",
]

[project.urls]
Homepage = "https://github.com/uwa-lab/MeldFabric"
Repository = "https://github.com/uwa-lab/MeldFabric.git"
Issues = "https://github.com/uwa-lab/MeldFabric/issues"
Changelog = "https://github.com/uwa-lab/MeldFabric/blob/main/CHANGELOG.md"

[project.optional-dependencies]
langfuse = [
  "langfuse>=4.15.6,<4.16",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
]
sandbox-docker = ["docker>=7,<8"]
all = ["meldfabric[langfuse,sandbox-docker]"]

[dependency-groups]
dev = [
  "docker>=7,<8",
  "langfuse>=4.15.6,<4.16",
  "mypy>=1.14,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "playwright>=1.51,<1.52",
  "types-docker>=7,<8",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0.12,<7",
]
