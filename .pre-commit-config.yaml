repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-check
        name: Frontend checks
        entry: npm --prefix web run check
        language: system
        pass_filenames: false
        files: ^web/
